name: archive-releases

on:
  workflow_dispatch:
    inputs:
      cursor_versions:
        description: "Cursor 版本列表 (空格分隔), 留空 = 全部 3.23–3.30"
        required: false
        default: ""
      byok_versions:
        description: "cursor-byok 上游 tag (空格分隔)"
        required: false
        default: "v1.0.1 v1.0.0"

permissions:
  contents: write

jobs:
  cursor:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载并上传 Cursor ${{ matrix.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys, glob
          from datetime import datetime
          ver = os.environ["VERSION"]
          info = json.load(open("data/versions.json", encoding="utf-8"))["versions"][ver]
          subprocess.run(["mkdir", "-p", "assets"], check=True)
          for plat, meta in info["platforms"].items():
              url = meta["downloadUrl"]
              fname = url.rsplit("/", 1)[-1]
              r = subprocess.run(["curl", "-L", "-C", "-", "--retry", "3",
                                  "--connect-timeout", "20", "-o", f"assets/{fname}", url])
              if r.returncode != 0:
                  print(f"下载失败 {plat}: {url}", file=sys.stderr)
                  sys.exit(1)

          # Release notes: 日期 + 日期 ±3 天内的更新日志(含正文)
          notes = f"发布日期: {info.get('date', 'unknown')}\n"
          try:
              d0 = datetime.strptime(info["date"], "%Y-%m-%d").date()
              entries = json.load(open("changelogs/content/index.json", encoding="utf-8"))
              hits = [e for e in entries
                      if abs((datetime.strptime(e["date"], "%Y-%m-%d").date() - d0).days) <= 3]
              for e in sorted(hits, key=lambda x: x["date"]):
                  try:
                      md = open(f"changelogs/content/{e['slug']}.md", encoding="utf-8").read()
                  except FileNotFoundError:
                      continue
                  notes += "\n---\n" + md
          except ValueError:
              pass

          tag = ver
          r = subprocess.run(["gh", "release", "view", tag], capture_output=True)
          if r.returncode != 0:
              subprocess.run(["gh", "release", "create", tag,
                              "--title", f"Cursor {ver}", "--notes", notes], check=True)
          subprocess.run(["gh", "release", "upload", tag, *sorted(glob.glob("assets/*"))], check=True)
          EOF

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          ALL=$(python3 -c "
          import json
          d = json.load(open('data/versions.json'))['versions']
          vs = sorted(d, key=lambda v: [int(x) for x in v.split('.')])
          print(json.dumps(vs))
          ")
          GIVEN="${{ github.event.inputs.cursor_versions }}"
          if [ -n "$GIVEN" ]; then
            python3 -c "
          import json, sys
          all_vs = json.loads('''$ALL''')
          given = set(sys.argv[1].split())
          print(json.dumps([v for v in all_vs if v in given]))
          " "$GIVEN" > /tmp/matrix
          else
            echo "$ALL" > /tmp/matrix
          fi
          echo "matrix=$(cat /tmp/matrix)" >> $GITHUB_OUTPUT

  cursor-linux-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 deb/rpm 并上传到对应版本的 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, re, subprocess, sys, os
          d = json.load(open("data/versions.json", encoding="utf-8"))["versions"]
          base = "https://downloads.cursor.com/production"
          # 每个版本用自身 commit SHA 拼出 4 个 deb/rpm 直链
          tpls = [
              "linux/x64/deb/amd64/deb/cursor_{v}_amd64.deb",
              "linux/x64/rpm/x86_64/cursor-{v}.el8.x86_64.rpm",
              "linux/arm64/deb/arm64/deb/cursor_{v}_arm64.deb",
              "linux/arm64/rpm/aarch64/cursor-{v}.el8.aarch64.rpm",
          ]
          for ver, info in sorted(d.items(), key=lambda kv: [int(p) for p in kv[0].split(".")]):
              m = re.search(r"/production/([0-9a-f]{40})/",
                            next(iter(info["platforms"].values()))["downloadUrl"])
              if not m:
                  print(f"跳过 {ver}: 无法提取 commit SHA", file=sys.stderr)
                  continue
              sha = m.group(1)
              paths = [p.format(v=ver) for p in tpls]
              r = subprocess.run(["gh", "release", "view", ver, "--json", "assets",
                                  "-q", ".assets[].name"], capture_output=True, text=True)
              if r.returncode != 0:
                  subprocess.run(["gh", "release", "create", ver,
                                  "--title", f"Cursor {ver}",
                                  "--notes", f"发布日期: {info.get('date','')}"], check=True)
                  r = subprocess.run(["gh", "release", "view", ver, "--json", "assets",
                                      "-q", ".assets[].name"], capture_output=True, text=True)
              existing = set(r.stdout.split())
              missing = [p for p in paths if p.rsplit("/", 1)[-1] not in existing]
              if not missing:
                  print(f"跳过 {ver}: deb/rpm 已齐全")
                  continue
              os.makedirs("pkgs", exist_ok=True)
              files = []
              for p in missing:
                  fname = p.rsplit("/", 1)[-1]
                  out = f"pkgs/{fname}"
                  url = f"{base}/{sha}/{p}"
                  rc = subprocess.run(["curl", "-fL", "--retry", "3",
                                       "--connect-timeout", "20", "-o", out, url]).returncode
                  if rc != 0 or not os.path.exists(out) or os.path.getsize(out) == 0:
                      print(f"下载失败 {ver} {fname} {url}", file=sys.stderr)
                      sys.exit(1)
                  files.append(out)
              subprocess.run(["gh", "release", "upload", ver, *files, "--clobber"], check=True)
              for f in files:
                  os.remove(f)
              print(f"已补齐 {ver}: {len(files)} 个 deb/rpm")
          EOF

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 changelog 正文刷新各版本 Release 说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess
          from datetime import datetime
          d = json.load(open("data/versions.json", encoding="utf-8"))["versions"]
          entries = json.load(open("changelogs/content/index.json", encoding="utf-8"))
          for ver, info in sorted(d.items(), key=lambda kv: kv[0]):
              try:
                  d0 = datetime.strptime(info["date"], "%Y-%m-%d").date()
              except ValueError:
                  continue
              notes = f"发布日期: {info.get('date', 'unknown')}\n"
              hits = [e for e in entries
                      if abs((datetime.strptime(e["date"], "%Y-%m-%d").date() - d0).days) <= 3]
              for e in sorted(hits, key=lambda x: x["date"]):
                  try:
                      md = open(f"changelogs/content/{e['slug']}.md", encoding="utf-8").read()
                  except FileNotFoundError:
                      continue
                  notes += "\n---\n" + md
              if not hits:
                  notes += "\n该发布日期前后 3 天内没有官方更新日志条目。"
              subprocess.run(["gh", "release", "edit", ver, "--notes", notes], check=True)
              print("updated", ver)
          EOF

  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并上传 cursor-byok 资产
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: leookun/cursor-byok
          REPO: ${{ github.repository }}
          VERSIONS: ${{ github.event.inputs.byok_versions || 'v1.0.1 v1.0.0' }}
        run: |
          for tag in $VERSIONS; do
            echo "== 处理 $tag"
            dir="assets/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -R "$UPSTREAM" --pattern '*' --dir "$dir"
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              echo "Release $tag 已存在, 跳过创建"
            else
              title=$(gh release view "$tag" -R "$UPSTREAM" --json name -q .name)
              body=$(gh release view "$tag" -R "$UPSTREAM" --json body -q .body)
              gh release create "$tag" -R "$REPO" --title "$title" --notes "$body"
            fi
            gh release upload "$tag" -R "$REPO" "$dir"/* --clobber
          done
