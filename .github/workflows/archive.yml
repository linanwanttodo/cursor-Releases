name: archive-releases

on:
  workflow_dispatch:
    inputs:
      cursor_versions:
        description: "Cursor 版本列表 (空格分隔), 留空 = 全部 3.23–3.30"
        required: false
        default: ""
      byok_versions:
        description: "cursor-byok 上游 tag (空格分隔)"
        required: false
        default: "v1.0.1 v1.0.0"

permissions:
  contents: write

jobs:
  cursor:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载并上传 Cursor ${{ matrix.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys, glob
          from datetime import datetime
          ver = os.environ["VERSION"]
          info = json.load(open("data/versions.json", encoding="utf-8"))["versions"][ver]
          subprocess.run(["mkdir", "-p", "assets"], check=True)
          for plat, meta in info["platforms"].items():
              url = meta["downloadUrl"]
              fname = url.rsplit("/", 1)[-1]
              r = subprocess.run(["curl", "-L", "-C", "-", "--retry", "3",
                                  "--connect-timeout", "20", "-o", f"assets/{fname}", url])
              if r.returncode != 0:
                  print(f"下载失败 {plat}: {url}", file=sys.stderr)
                  sys.exit(1)

          # Release notes: 日期 + 日期 ±3 天内的更新日志(含正文)
          notes = f"发布日期: {info.get('date', 'unknown')}\n"
          try:
              d0 = datetime.strptime(info["date"], "%Y-%m-%d").date()
              entries = json.load(open("changelogs/content/index.json", encoding="utf-8"))
              hits = [e for e in entries
                      if abs((datetime.strptime(e["date"], "%Y-%m-%d").date() - d0).days) <= 3]
              for e in sorted(hits, key=lambda x: x["date"]):
                  try:
                      md = open(f"changelogs/content/{e['slug']}.md", encoding="utf-8").read()
                  except FileNotFoundError:
                      continue
                  notes += "\n---\n" + md
          except ValueError:
              pass

          tag = ver
          r = subprocess.run(["gh", "release", "view", tag], capture_output=True)
          if r.returncode != 0:
              subprocess.run(["gh", "release", "create", tag,
                              "--title", f"Cursor {ver}", "--notes", notes], check=True)
          subprocess.run(["gh", "release", "upload", tag, *sorted(glob.glob("assets/*"))], check=True)
          EOF

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          ALL=$(python3 -c "
          import json
          d = json.load(open('data/versions.json'))['versions']
          vs = sorted(d, key=lambda v: [int(x) for x in v.split('.')])
          print(json.dumps(vs))
          ")
          GIVEN="${{ github.event.inputs.cursor_versions }}"
          if [ -n "$GIVEN" ]; then
            python3 -c "
          import json, sys
          all_vs = json.loads('''$ALL''')
          given = set(sys.argv[1].split())
          print(json.dumps([v for v in all_vs if v in given]))
          " "$GIVEN" > /tmp/matrix
          else
            echo "$ALL" > /tmp/matrix
          fi
          echo "matrix=$(cat /tmp/matrix)" >> $GITHUB_OUTPUT

  cursor-linux-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 deb/rpm 并上传到对应版本的 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys, glob
          d = json.load(open("data/versions.json", encoding="utf-8"))["versions"]
          # 按次版本分组, 取最新补丁版本作为该系列的 Release tag
          minors = {}
          for v in sorted(d, key=lambda x: [int(p) for p in x.split(".")]):
              minors[".".join(v.split(".")[:2])] = v
          for minor, tag in minors.items():
              print(f"== {minor} -> {tag}")
              files = []
              for plat in ("linux-x64-deb", "linux-arm64-deb",
                           "linux-x64-rpm", "linux-arm64-rpm"):
                  url = f"https://api2.cursor.sh/updates/download/golden/{plat}/cursor/{minor}"
                  out = url.rsplit("/", 3)[-3]  # 占位, 用重定向文件名更好
                  r = subprocess.run(
                      ["curl", "-sL", "--retry", "3", "-o", f"/tmp/{plat}.bin",
                       "-w", "%{url_effective}", url],
                      capture_output=True, text=True)
                  final = r.stdout.strip()
                  ext = "deb" if "deb" in plat else "rpm"
                  # 用最终 URL 的文件名, 保持与官网一致
                  fname = final.rsplit("/", 1)[-1] or f"cursor-{minor}-{plat}.{ext}"
                  subprocess.run(["mv", f"/tmp/{plat}.bin", fname], check=True)
                  files.append(fname)
              r = subprocess.run(["gh", "release", "view", tag], capture_output=True)
              if r.returncode != 0:
                  subprocess.run(["gh", "release", "create", tag,
                                  "--title", f"Cursor {tag}",
                                  "--notes", f"发布日期: {d[tag].get('date','')}\n\n"
                                  + "deb/rpm 来自官方 golden 端点"], check=True)
              subprocess.run(["gh", "release", "upload", tag, *files, "--clobber"], check=True)
          EOF

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 用 changelog 正文刷新各版本 Release 说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, subprocess
          from datetime import datetime
          d = json.load(open("data/versions.json", encoding="utf-8"))["versions"]
          entries = json.load(open("changelogs/content/index.json", encoding="utf-8"))
          for ver, info in sorted(d.items(), key=lambda kv: kv[0]):
              try:
                  d0 = datetime.strptime(info["date"], "%Y-%m-%d").date()
              except ValueError:
                  continue
              notes = f"发布日期: {info.get('date', 'unknown')}\n"
              hits = [e for e in entries
                      if abs((datetime.strptime(e["date"], "%Y-%m-%d").date() - d0).days) <= 3]
              for e in sorted(hits, key=lambda x: x["date"]):
                  try:
                      md = open(f"changelogs/content/{e['slug']}.md", encoding="utf-8").read()
                  except FileNotFoundError:
                      continue
                  notes += "\n---\n" + md
              if not hits:
                  notes += "\n该发布日期前后 3 天内没有官方更新日志条目。"
              subprocess.run(["gh", "release", "edit", ver, "--notes", notes], check=True)
              print("updated", ver)
          EOF

  byok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并上传 cursor-byok 资产
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: leookun/cursor-byok
          REPO: ${{ github.repository }}
          VERSIONS: ${{ github.event.inputs.byok_versions || 'v1.0.1 v1.0.0' }}
        run: |
          for tag in $VERSIONS; do
            echo "== 处理 $tag"
            dir="assets/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -R "$UPSTREAM" --pattern '*' --dir "$dir"
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              echo "Release $tag 已存在, 跳过创建"
            else
              title=$(gh release view "$tag" -R "$UPSTREAM" --json name -q .name)
              body=$(gh release view "$tag" -R "$UPSTREAM" --json body -q .body)
              gh release create "$tag" -R "$REPO" --title "$title" --notes "$body"
            fi
            gh release upload "$tag" -R "$REPO" "$dir"/* --clobber
          done
